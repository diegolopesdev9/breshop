<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    
    <title id="seo-title">Carregando Desapego... | Breshop</title>
    <meta id="seo-desc" name="description" content="Desapego exclusivo no Breshop." />
    
    <!-- SEO & Robots -->
    <meta name="robots" content="index, follow" />
    <link id="canonical-url" rel="canonical" href="https://www.breshop.com.br/produto" />

    <!-- Open Graph / WhatsApp / Facebook -->
    <meta property="og:type" content="product" />
    <meta id="og-title" property="og:title" content="Desapego | Breshop" />
    <meta id="og-desc" property="og:description" content="Confira este desapego exclusivo no Breshop." />
    <meta id="og-image" property="og:image" content="https://www.breshop.com.br/logo.webp" />
    <meta id="og-url" property="og:url" content="https://www.breshop.com.br/produto" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" href="/favicon.webp" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <link rel="stylesheet" href="/src/css/main.css" />
</head>
<body class="antialiased bg-background text-on-background font-body-md overflow-x-hidden flex flex-col min-h-screen">

    <main class="pt-[100px] pb-16 max-w-7xl mx-auto w-full flex-1 px-4 md:px-8 flex flex-col">
        
        <nav class="flex text-[10px] md:text-xs uppercase tracking-widest text-on-surface-variant mb-6 font-label-sm font-bold">
            <a href="/" class="hover:text-primary transition-colors">Home</a>
            <span class="mx-2">/</span>
            <a href="/comprar" class="hover:text-primary transition-colors">Comprar</a>
            <span class="mx-2">/</span>
            <span id="breadcrumb-nome" class="text-on-background truncate">Detalhes</span>
        </nav>

        <div id="peca-loading" class="w-full py-24 flex flex-col items-center justify-center text-on-surface-variant">
            <p class="font-label-sm text-sm uppercase tracking-widest animate-pulse">Buscando informações do desapego...</p>
        </div>

        <div id="peca-container" class="grid grid-cols-1 md:grid-cols-2 gap-8 lg:gap-12 hidden opacity-0 transition-opacity duration-500"></div>

    </main>

    <script type="module" src="/src/js/produto.js"></script>

</html>
