<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    
    <title>Contato | Breshop</title>
    <meta name="description" content="Fale com a equipe do Breshop. Suporte para vendas, compras e devoluções." />

    <!-- SEO & Robots -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.breshop.com.br/contato" />

    <!-- Open Graph / WhatsApp / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Contato | Breshop" />
    <meta property="og:description" content="Fale com a equipe do Breshop. Suporte para vendas, compras e devoluções." />
    <meta property="og:image" content="https://www.breshop.com.br/logo.webp" />
    <meta property="og:url" content="https://www.breshop.com.br/contato" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" href="/favicon.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/src/css/main.css" />
</head>
<body class="antialiased bg-background text-on-background font-body-md overflow-x-hidden flex flex-col min-h-screen">
    <main class="pt-[100px] pb-24 max-w-4xl mx-auto px-4 md:px-8 flex-1 w-full">
        <div class="mb-10 border-b border-outline-variant pb-6">
            <h1 class="font-headline-xl text-4xl md:text-5xl text-on-background mb-4">Fale Conosco.</h1>
            <p class="font-label-sm text-xs text-on-surface-variant uppercase tracking-widest font-bold">Estamos aqui para ajudar</p>
        </div>
        <div class="bg-surface-container rounded-3xl p-6 md:p-10 border border-outline-variant shadow-sm space-y-6 text-center md:text-left">
            <p class="font-body-md text-sm text-on-surface-variant mb-8">Teve algum problema com a sua venda, precisa de ajuda com uma devolução ou tem dúvidas sobre a plataforma? Acione nossa equipe de suporte.</p>
            <div class="flex flex-col gap-6">
                <div class="flex items-center justify-center md:justify-start gap-4">
                    <span class="material-symbols-outlined text-4xl text-primary bg-primary-container p-3 rounded-full">mail</span>
                    <div>
                        <span class="block font-label-lg font-bold text-sm">E-mail de Suporte</span>
                        <span class="block font-body-md text-sm text-on-surface-variant">suporte@breshop.com.br</span>
                    </div>
                </div>
                <div class="flex items-center justify-center md:justify-start gap-4">
                    <span class="material-symbols-outlined text-4xl text-primary bg-primary-container p-3 rounded-full">chat</span>
                    <div>
                        <span class="block font-label-lg font-bold text-sm">WhatsApp (Seg a Sex, 9h-18h)</span>
                        <span class="block font-body-md text-sm text-on-surface-variant">(15) 99833-2211</span>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script type="module" src="/src/js/main.js"></script>
</body>
</html>
